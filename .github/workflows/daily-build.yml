name: Source validation (manual)

# No scheduled builds, APK publication or upstream signing credentials.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test without Firebase credentials
        run: bash ./gradlew :app:testGithubDebugUnitTest :workspace:testDebugUnitTest -x :app:processGithubDebugGoogleServices
